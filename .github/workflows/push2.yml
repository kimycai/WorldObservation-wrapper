name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl unzip git

      - name: Install LLVM
        run: sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK r23b
        run: |
          curl -fLO https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -d . android-ndk-r23b-linux.zip
          NDK_BIN="android-ndk-r23b/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ln -sf x86_64-linux-android21-clang    "$NDK_BIN/x86_64-linux-android22-clang"
          ln -sf x86_64-linux-android21-clang++  "$NDK_BIN/x86_64-linux-android22-clang++"

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-linux
          path: |
            wrapper
            rootfs/system/bin/main
